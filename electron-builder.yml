appId: io.github.jin-wen-jie.deepseek-harness-desktop
productName: DeepSeek Harness
copyright: Copyright © 2026 Jin-wen-jie and contributors
# The bundled dsh CLI runs with ELECTRON_RUN_AS_NODE, so plain files beat an asar archive.
asar: false
npmRebuild: false
# electron-updater needs the GitHub feed: publish config generates
# app-update.yml in the app and latest.yml/blockmap on the release.
publish:
  provider: github
  owner: Jin-wen-jie
  repo: DeepSeek-Harness-Desktop-App
# GitHub is slow or unreachable in some regions; pull the Electron binary from the npmmirror CDN.
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - assets/icon.png
  - assets/icon.ico
  - "!assets/icon-src/**"
win:
  icon: build/icon.ico
  target:
    - nsis
    - zip
nsis:
  # oneClick is required for silent auto-updates: the updater installs on
  # quit without any wizard. Installs to the per-user default directory.
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness
  artifactName: DeepSeek-Harness-Setup-${version}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
